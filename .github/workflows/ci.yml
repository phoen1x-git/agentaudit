name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Check the entry point
        run: |
          agentaudit --version
          agentaudit validate

      - name: Syntax
        run: python -m compileall -q app core tools demo tests

      - name: Validate the rule configuration
        run: python tools/validate_config.py

      - name: Rule self-tests
        run: python tools/run_selftests.py

      - name: Scan the bundled sample project
        run: python app/scan.py --demo --tag ci

      - name: Tests
        run: python -m pytest -q

  # The Dockerfile cannot be checked by reading it, and the machine it was written on has no
  # Docker. This job is how it gets verified. A wrong CodeQL release layout fails the build
  # itself -- see step 2 in the Dockerfile.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t agentaudit .

      - name: Is the CodeQL CLI actually in there, and does it run?
        run: docker run --rm --entrypoint /opt/agentaudit/_tools/codeql/codeql agentaudit version

      - name: Does the entry point work?
        run: docker run --rm --entrypoint agentaudit agentaudit --version

      # One step, and one container. These were two docker runs, and the second one could
      # never have worked: each `docker run` starts a fresh container, so the round the first
      # one wrote was gone by the time the second looked for it. Mounting a volume fixes the
      # check and tests the documented way of getting output out of the image.
      - name: Scan the bundled sample, and check the round landed on the host
        run: |
          mkdir -p docker-out
          docker run --rm -v "$PWD/docker-out:/scan/out" agentaudit --demo --tag ci-docker
          test -f docker-out/round-ci-docker/findings.tsv
          ls -la docker-out/round-ci-docker/
