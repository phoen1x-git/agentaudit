# ★ 探针 model pack（2026-10-13）—— 验证官方文档说的「模型包」结构能否被加载。
# 文档依据（GitHub Docs「Creating and working with CodeQL packs」）：
#   「A model pack is a CodeQL pack with: library: true / no dependencies /
#    one or more extensionTargets / a dataExtensions property」
name: af/python-model-pack
version: 0.0.1
library: true
extensionTargets:
  codeql/python-all: "*"
dataExtensions:
  - models/**/*.yml
