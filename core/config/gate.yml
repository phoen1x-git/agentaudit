# 内核 · 目标健康门（扫之前先过这道门）
#
# ★ 为什么要有它（用户 2026-10-09 要求）：归档 / 长期无人维护的项目 → 不扫了。
#
# ★ 但要说清：这道门**不是新发明**。 早就定了四条硬标准
#   （不是 fork / 未归档 / 有真实代码 / not covered by the baseline），"未归档"写在最前面。
#   问题在于 第一轮我**直接用了现成的旧库**（samplebi / sampledelegate / sampleframe），
#   没走这道门 —— 结果 5 条候选最后 0 条值得报，两个仓库已归档、一个被 issue 报遍。
#   → 那次不是检测错了，是**目标根本就不该扫**。
#
# ★ 跳过要**出声**：每个被跳过的目标都要在 scan.log 里留下原因。
#
# ★★ 两个模式：
#   **「能不能报出去」≠「能不能检出」—— 用途不同，门槛就不该一样。**
#   alive  ：报给开发者 → 归档/长期不维护 = 跳过（没人修，报了白报）
#   detect ：验证检出能力 / 算命中率 → **不跳过**（目标是"里面得有真洞"，仓库活不活着无关）
#   ★ 踩过的坑：把 alive 用在所有场景 → 把手里唯一有真洞的测试集换掉了：
#     老 3 个目标（2 个已归档）产出 6 条 vuln（含公告真阳），"健康"的新目标批 0 条。

version: 2
updated: 2026-10-10

gate:
  mode: alive                     # alive（默认，报给开发者）/ detect（验证检出能力）
  skip_if_fork: true              # 两种模式都查：fork 的洞上游不认
  skip_if_archived: true          # ★ 仅 alive 模式生效
  skip_if_disabled: true          # 两种模式都查
  max_stale_months: 12            # ★ 仅 alive 模式生效
  min_stars: 0                    # 0 = 不限。★ 低星不等于没洞
  ttl_days: 1                     # 健康检查结果的缓存时间（健康状态会变，不能永缓存）
