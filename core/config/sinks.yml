# Danger-call registry (sink registry).
#
# `core/gen_ql.py` turns this file into CodeQL queries:
#     is_sink(call) = is_sink_paper(call)   # the baseline set
#                   or is_sink_config(call) # entries below with source: extra
# With no `extra` entries the generated queries are byte-compatible with the baseline,
# which is what makes single-variable experiments possible.
#
# Fields
#   source     paper  -> baseline set (kept for reference, not generated)
#              extra  -> everything added on top; this is the only part that changes results
#   cls        direct     -> matchable by name alone
#              structural -> requires chasing a definition site (not generated yet)
#   obj        object name; "*" means any object (noisy, use sparingly)
#   obj2       two-level attribute, e.g. `os.path` in `os.path.join(...)`
#   obj_suffix object name must end with this string
#   func       method name
#   name       bare function name, e.g. `eval`
#   group      switch group; disabled unless AF_SINKS_<GROUP>=1

version: 2
updated: 2026-10-14

sinks:
  # ---------- baseline set (reference only; not generated) ----------
  - {id: subprocess.run,    source: paper, cls: direct, obj: subprocess, func: run}
  - {id: subprocess.Popen,  source: paper, cls: direct, obj: subprocess, func: Popen}
  - {id: os.system,         source: paper, cls: direct, obj: os,         func: system}
  - {id: requests.get,      source: paper, cls: direct, obj: requests,   func: get}
  - {id: requests.post,     source: paper, cls: direct, obj: requests,   func: post}
  - {id: requests.request,  source: paper, cls: direct, obj: requests,   func: request}
  - {id: jinja.from_string, source: paper, cls: direct, obj: jinja,      func: from_string}
  - {id: eval,              source: paper, cls: direct, name: eval}
  - {id: exec,              source: paper, cls: direct, name: exec}
  - {id: session.execute,   source: paper, cls: direct, obj: "*", func: execute,
     note: matches any object's .execute(...) }

  # ---------- database clients ----------
  # Some DB clients expose .query(...) rather than .execute(...). Matching on the generic
  # method name alone is far too noisy (an ORM's `.query(Model)` is not SQL), so the rule
  # keys on the receiver name instead: only objects whose name ends in `conn`.
  - id: conn-query
    source: extra
    cls: direct
    obj_suffix: conn
    func: query
    note: ".query(...) on any object whose name ends with `conn`"

  # ---------- file I/O (switch AF_SINKS_FS=1, off by default) ----------
  # Only module-level receivers that match exactly. pathlib's Path methods take a variable
  # receiver and cannot be matched by receiver name here, so they are deliberately absent.
  # Bare `open` is also absent on purpose: it is too common and drowns the candidate list.
  - {id: os.remove,   source: extra, group: fs, cls: direct, obj: os,     func: remove}
  - {id: os.unlink,   source: extra, group: fs, cls: direct, obj: os,     func: unlink}
  - {id: os.rename,   source: extra, group: fs, cls: direct, obj: os,     func: rename}
  - {id: os.replace,  source: extra, group: fs, cls: direct, obj: os,     func: replace}
  - {id: os.mkdir,    source: extra, group: fs, cls: direct, obj: os,     func: mkdir}
  - {id: os.makedirs, source: extra, group: fs, cls: direct, obj: os,     func: makedirs}
  - {id: os.rmdir,    source: extra, group: fs, cls: direct, obj: os,     func: rmdir}
  - {id: os.chmod,    source: extra, group: fs, cls: direct, obj: os,     func: chmod}
  - {id: os.truncate, source: extra, group: fs, cls: direct, obj: os,     func: truncate}
  - {id: os.symlink,  source: extra, group: fs, cls: direct, obj: os,     func: symlink}
  - {id: os.link,     source: extra, group: fs, cls: direct, obj: os,     func: link}
  - {id: os.walk,     source: extra, group: fs, cls: direct, obj: os,     func: walk}
  - {id: os.listdir,  source: extra, group: fs, cls: direct, obj: os,     func: listdir}
  - {id: shutil.copy,     source: extra, group: fs, cls: direct, obj: shutil, func: copy}
  - {id: shutil.copy2,    source: extra, group: fs, cls: direct, obj: shutil, func: copy2}
  - {id: shutil.copyfile, source: extra, group: fs, cls: direct, obj: shutil, func: copyfile}
  - {id: shutil.copytree, source: extra, group: fs, cls: direct, obj: shutil, func: copytree}
  - {id: shutil.move,     source: extra, group: fs, cls: direct, obj: shutil, func: move}
  - {id: shutil.rmtree,   source: extra, group: fs, cls: direct, obj: shutil, func: rmtree}
  # Bare `open` was added back as an A/B experiment and removed again: it raised candidates
  # by ~49% and false positives from 0% to ~26% while true positives did not move at all.
  # It stays gated behind the `fs` group, so it is off unless AF_SINKS_FS=1 and the
  # experiment above has not been shown to pay off.
  - {id: open,  source: extra, group: fs, cls: direct, name: open}
  - {id: save_to_file,     source: extra, group: fs, cls: direct, name: save_to_file}
  - {id: write_to_storage, source: extra, group: fs, cls: direct, name: write_to_storage}
  # `urllib.request.urlretrieve` needs the two-level form: a `obj: urllib.request` entry
  # never matched, because the receiver string for that expression is "Attribute".
  - {id: urllib.urlretrieve, source: extra, group: fs, cls: direct, obj2: urllib.request,
     func: urlretrieve}

  # ---------- path construction (switch AF_SINKS_PATH=1, off by default) ----------
  # Path traversal lives in how a path is *built*, not in what is done with it afterwards,
  # so `os.path.join` has to be treated as a sink or the whole class is invisible.
  # It is a constructor rather than an executor, so on its own it reports a lot:
  # group `path` is deliberately separate from `fs` so the two can be enabled independently.
  - {id: os.path.join,    source: extra, group: path, cls: direct, obj2: os.path, func: join}
  - {id: os.path.abspath, source: extra, group: path, cls: direct, obj2: os.path, func: abspath}

  # ---------- httpx / aiohttp (switch AF_SINKS_HTTP=1, off by default) ----------
  # Modern LLM/agent stacks have largely moved from `requests` to `httpx`, while the
  # baseline set only knows requests.*. Module-level httpx calls are therefore uncovered
  # unless this group is on. `httpx.Request(...)` is included because that is where the URL
  # is assembled, which is the actual source for SSRF.
  - {id: httpx.get,     source: extra, group: http, cls: direct, obj: httpx,  func: get}
  - {id: httpx.post,    source: extra, group: http, cls: direct, obj: httpx,  func: post}
  - {id: httpx.put,     source: extra, group: http, cls: direct, obj: httpx,  func: put}
  - {id: httpx.patch,   source: extra, group: http, cls: direct, obj: httpx,  func: patch}
  - {id: httpx.delete,  source: extra, group: http, cls: direct, obj: httpx,  func: delete}
  - {id: httpx.head,    source: extra, group: http, cls: direct, obj: httpx,  func: head}
  - {id: httpx.request, source: extra, group: http, cls: direct, obj: httpx,  func: request}
  - {id: httpx.stream,  source: extra, group: http, cls: direct, obj: httpx,  func: stream}
  - {id: httpx.Request, source: extra, group: http, cls: direct, obj: httpx,  func: Request}
  - {id: httpx.HTTPTransport,      source: extra, group: http, cls: direct, obj: httpx, func: HTTPTransport}
  - {id: httpx.AsyncHTTPTransport, source: extra, group: http, cls: direct, obj: httpx, func: AsyncHTTPTransport}
  - {id: httpx.Client,      source: extra, group: http, cls: direct, obj: httpx, func: Client}
  - {id: httpx.AsyncClient, source: extra, group: http, cls: direct, obj: httpx, func: AsyncClient}

  # ---------- dynamic import / dispatch (switch AF_SINKS_DYNIMP=1, off by default) ----------
  # When the name of the function to call is derived from model output, the dangerous call
  # itself is `import_module` / `__import__` / a dynamic `getattr`, none of which are in the
  # baseline set. Dynamic imports are common in ordinary code (lazy loading, plugins), so
  # this group is noisy and off by default.
  - {id: importlib.import_module, source: extra, group: dynimp, cls: direct, obj: importlib, func: import_module}
  - {id: __import__,             source: extra, group: dynimp, cls: direct, name: __import__}
  # `from importlib import import_module` produces a bare-name call, so it needs its own entry.
  - {id: import_module,          source: extra, group: dynimp, cls: direct, name: import_module}
